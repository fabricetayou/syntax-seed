# it-langs — catalog index (fetch this first; then per-language fiches by slug)
catalog: it-langs
repo: fabricetayou/syntax-seed
purpose: 'One YAML fiche per programming language, built for the Pica (Picandra Everwise) agent on Pollinations.
  Coverage: the whole history of programming languages — pioneers to the AI era — including formats, queries, hardware
  description, proof assistants and esoteric languages.'
generated: '2026-11-04'
count: 212
schema:
  name: display name of the language
  slug: file slug (== filename without .yaml)
  first_appeared: year of first public appearance (int)
  year_note: precision/approximations about the year
  creators: persons or teams credited with the design
  origin: institution, company, country or community
  era: computed decade bucket (pre-1950 ... 2020s)
  status: active | maintained | dormant | historical | discontinued | esoteric
  paradigms: programming paradigms
  typing: type discipline in one line
  execution: how programs run (compiled/interpreted/transpiled/evaluated/none)
  non_executable: true for descriptive languages (markup, data, modeling, notation) with no computational execution
    of their own
  family: genealogical family / branch
  influenced_by: ancestors and sources of inspiration
  influenced: descendants and languages it shaped
  underlying: what the language sits on / compiles to (VM, IR, C, hardware...)
  domains: application domains
  hello_world: canonical first program (major languages)
  install: how to get a toolchain quickly
  docs: official documentation link
  tag: one-line memorable summary
  summary: short historical essay
stats:
  eras:
    pre-1950: 3
    1950s: 6
    1960s: 19
    1970s: 21
    1980s: 35
    1990s: 36
    2000s: 42
    2010s: 42
    2020s: 8
  statuses:
    historical: 14
    active: 135
    maintained: 31
    dormant: 15
    esoteric: 11
    discontinued: 6
  non_executable: 16
  with_hello_world: 154
roadmap:
  next_batches:
  - the long tail of named languages (thousands of minor and regional languages)
  - more AI-era languages and prompt-era DSLs as they stabilize
  - per-language quick-start detail (first concepts, pitfalls, ecosystem notes)
  - deeper genealogy edges (exact influence links between all fiches)
  dream: Cover EVERY named programming language since the beginning.
