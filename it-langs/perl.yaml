name: Perl
slug: perl
first_appeared: 1987
year_note: Perl 5 (1994) was the great leap; Raku split off as a sibling in 2015
creators: Larry Wall
origin: USA (NASA/JPL engineer's project)
era: 1980s
status: active
paradigms:
- 'multi-paradigm scripting: procedural with functional spices'
