influenced_by:
- C
- sed
- awk
- shell
- Lisp (partly)
- the report-writing problem at hand
influenced:
- PHP
- Ruby (partly)
- JavaScript's Perl-style regexes
- Python's rise partly as its rival
- Raku (its own reinvention)
underlying: the perl interpreter with CPAN — the first great module ecosystem
domains:
- CGI-era web
- sysadmin automation
- bioinformatics (early genomics pipelines)
- text wrangling
hello_world: print "Hello, World!\n";
install: system perl or perlbrew; cpanm for modules
docs: https://perldoc.perl.org/
tag: the duct tape of the early web — regex-native scripting
summary: Larry Wall's linguistic language — designed like a natural language, with idioms, context and sigils, plus
