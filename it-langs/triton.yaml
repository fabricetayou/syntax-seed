# it-langs fiche — Triton — corpus for the Pica agent (syntax-seed)
name: Triton
slug: triton
first_appeared: 2019
year_note: Tillet's research prototype (2019); adopted and scaled by OpenAI from 2021
creators: Philippe Tillet (NYU research), then OpenAI's team
origin: New York University → OpenAI (USA/France roots)
era: 2010s
status: active
paradigms:
- Python-embedded DSL for GPU kernels (blocks of tensors as the programming unit)
typing: static via JIT specialization on shapes/dtypes
execution: compiled through MLIR to GPU code (NVIDIA primarily)
non_executable: false
family: AI-kernel DSL family (CUDA's Python-native cousin)
influenced_by:
- GPU kernel practice
- Python hosting
- MLIR compilation
influenced:
- PyTorch 2.0's compiled kernels (torch.compile) ride on it
underlying: compiles to PTX/SASS via MLIR; runs inside PyTorch pipelines
domains:
- writing fast GPU kernels without writing CUDA C++
hello_world: |-
  @triton.jit
  def hello_kernel(x_ptr, n, BLOCK: tl.constexpr):
      pid = tl.program_id(0)
      offs = pid * BLOCK + tl.arange(0, BLOCK)
      tl.store(x_ptr + offs, 1.0, mask=offs < n)
docs: https://triton-lang.org/
tag: GPU kernels written in Python-flavored blocks (2019)
summary: 'The kernel language of the AI era''s middle layer: Python decorators and tensor blocks, compiled to GPU
  machine code. torch.compile made it the way PyTorch itself gets fast.'
