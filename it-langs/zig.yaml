# it-langs fiche — Zig — corpus for the Pica agent (syntax-seed)
name: Zig
slug: zig
first_appeared: 2016
creators: Andrew Kelley and contributors
origin: open source (USA, community-funded)
era: 2010s
status: active
paradigms:
- imperative systems programming with comptime (compile-time execution) instead of macros
typing: static, strong, explicit allocators — no hidden control flow
execution: compiled via LLVM to native code; cross-compiles trivially
non_executable: false
family: C's direct successor branch
influenced_by:
- C (target domain)
- Go (tooling philosophy)
- Rust (safety discourse)
influenced:
- Bun and TigerBeetle chose it
- the C-interop renaissance
underlying: LLVM; explicit allocators passed as parameters; comptime generics
domains:
- systems tooling
- databases
- JS runtimes
- C replacement projects
hello_world: |-
  const std = @import("std");

  pub fn main() !void {
      var buf: [64]u8 = undefined;
      const out = try std.fmt.bufPrint(&buf, "Hello, {s}!\n", .{"World"});
      _ = try std.io.getStdOut().write(out);
  }
install: ziglang.org downloads; zig build
docs: https://ziglang.org/learn/
tag: 'C re-thought: explicit allocators, comptime, perfect cross-compilation'
summary: '''No hidden control flow, no hidden allocations'': C''s simplicity with modern tooling and comptime metaprogramming.
  The choice of a new generation of infrastructure that wants C''s shape without its scars.'
