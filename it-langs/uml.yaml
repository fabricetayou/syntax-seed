family: modeling family (with SysML, ER diagrams as ancestors)
influenced_by:
- Booch
- OMT
- OOSE methods
- entity-relationship tradition
influenced:
- SysML
- model-driven engineering tools
- the vocabulary of enterprise architecture ('use case', 'sequence diagram')
underlying: drawn in modeling tools (Enterprise Architect, StarUML, PlantUML renders it)
domains:
- software design documentation
- enterprise architecture
tag: the diagram language of software design (1997)
summary: 'The Three Amigos'' unified diagram notation: the language software speaks when it doesn''t run but gets
