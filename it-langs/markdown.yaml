# it-langs fiche — Markdown — corpus for the Pica agent (syntax-seed)
name: Markdown
slug: markdown
first_appeared: 2004
creators: John Gruber (with Aaron Swartz's help on syntax ideas)
origin: Daring Fireball (USA)
era: 2000s
status: active
paradigms:
- declarative lightweight markup (headings, emphasis, lists, links)
typing: n/a
execution: none — rendered by Markdown processors to HTML
