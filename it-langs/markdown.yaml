family: lightweight markup family (with reST, AsciiDoc)
influenced_by:
- plain-text email conventions
- Setext
- reStructuredText ideas
influenced:
- CommonMark/MDX
- GitHub-flavored Markdown
- Discord/Slack message formatting
- static-site generators
underlying: rendered by parsers (cmark, remark) into HTML
domains:
- READMEs
- documentation
- notes
- forums
- books
hello_world: '**Hello, World!**'
docs: https://commonmark.org/help/
tag: the markup everyone writes without knowing it's a language
summary: Gruber's plain-text-to-HTML shorthand, designed to be readable as-is. Its dialects conquered documentation,
  chat and notes — the most widely written markup in history, in constant dialect wars (CommonMark, GFM, MDX).
