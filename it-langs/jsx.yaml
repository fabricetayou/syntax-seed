# it-langs fiche — JSX — corpus for the Pica agent (syntax-seed)
name: JSX
slug: jsx
first_appeared: 2014
creators: Facebook React team (Jordan Walke's earlier ideas; JSX popularized with React's open-sourcing 2013-2015)
origin: Facebook/Meta (USA)
era: 2010s
status: active
paradigms:
- 'syntax extension: HTML-like expressions that compile to function calls'
typing: static when used in TypeScript (.tsx)
execution: transpiled away to JavaScript createElement calls
