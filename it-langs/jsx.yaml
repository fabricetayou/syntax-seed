family: embedded-markup family (the EJS/JSX branch)
influenced_by:
- PHP/JSP template interleaving
- XML literals in ECMAScript proposals (E4X)
influenced:
- Vue's templates (counter-culture)
- Solid/ Qwik's JSX variants
- MDX
underlying: Babel/esbuild/SWC transpilers to React or other render calls
domains:
- UI components — the industry's dominant front-end notation
hello_world: |-
  function Hello() {
    return <h1>Hello, World!</h1>;
  }
tag: markup inside JavaScript — the UI notation wars' winner (2014)
summary: 'HTML hand-dropped into JavaScript: markup as expressions that become function calls. Despised on arrival,
  then so convenient it became the world''s default way to describe interfaces.'
